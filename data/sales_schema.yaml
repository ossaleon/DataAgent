name: "sales"
description: "Daily store-level sales transactions with pricing and promotion data"
file_path: "Store_Sales_Price_Elasticity_Promotions_Data.parquet"
columns:
  - name: "Store_Number"
    description: "Unique store identifier"
    data_type: "INTEGER"
    nullable: false

  - name: "SKU_Coded"
    description: "Encoded identifier for a specific individual product variant (SKU). Each SKU represents a unique sellable product. Many different SKUs can share the same Product_Class_Code."
    data_type: "INTEGER"
    nullable: false

  - name: "Product_Class_Code"
    description: "Classification code shared by all products belonging to the same product category. Multiple distinct SKUs share the same Product_Class_Code when they belong to the same category."
    data_type: "INTEGER"
    nullable: false

  - name: "Sold_Date"
    description: "Transaction date"
    data_type: "DATE"
    example_values: ["2019-01-01", "2021-11-15"]
    nullable: false

  - name: "Qty_Sold"
    description: "Number of units sold in this transaction"
    data_type: "INTEGER"
    nullable: false

  - name: "Total_Sale_Value"
    description: "Total revenue from this transaction in USD"
    data_type: "FLOAT"
    nullable: false

  - name: "On_Promo"
    description: "Whether item was on promotion (1=yes, 0=no)"
    data_type: "INTEGER"
    example_values: ["0", "1"]
    nullable: false
