# Thesis Test 03: max_tokens agent ladder for mistral-small3.2:24b.

defaults:
  lookup_sales_data:
    n: 1
    cot_n: 1
    bon_param: "temperature"
    temp_min: 0.15
    temp_max: 0.15
    top_p_min: 0.95
    top_p_max: 0.95
    top_k_min: 64
    top_k_max: 64
    max_tokens: 5000
    num_beams: 1
    no_repeat_ngram_size: null
    use_cache: false
  analyzing_data:
    n: 1
    cot_n: 1
    bon_param: "temperature"
    temp_min: 0.15
    temp_max: 0.15
    top_p_min: 0.95
    top_p_max: 0.95
    top_k_min: 64
    top_k_max: 64
    max_tokens: 7000
    num_beams: 1
    no_repeat_ngram_size: null
    use_cache: false
  create_visualization:
    n: 1
    cot_n: 1
    bon_param: "temperature"
    temp_min: 0.15
    temp_max: 0.15
    top_p_min: 0.95
    top_p_max: 0.95
    top_k_min: 64
    top_k_max: 64
    max_tokens: 7000
    num_beams: 1
    no_repeat_ngram_size: null
    use_cache: false

configs:
  - {name: lookup_max_tokens_2500, vary_step: lookup_sales_data, axis: max_tokens_2500, description: Lookup max_tokens=2500 with analysis/visualization generous, steps: {lookup_sales_data: {max_tokens: 2500}, analyzing_data: {max_tokens: 10000}, create_visualization: {max_tokens: 10000}}}
  - {name: lookup_max_tokens_3000, vary_step: lookup_sales_data, axis: max_tokens_3000, description: Lookup max_tokens=3000 with analysis/visualization generous, steps: {lookup_sales_data: {max_tokens: 3000}, analyzing_data: {max_tokens: 10000}, create_visualization: {max_tokens: 10000}}}
  - {name: lookup_max_tokens_5000_baseline, vary_step: lookup_sales_data, axis: baseline, description: Lookup baseline max_tokens=5000 with analysis/visualization generous, steps: {lookup_sales_data: {max_tokens: 5000}, analyzing_data: {max_tokens: 10000}, create_visualization: {max_tokens: 10000}}}
  - {name: lookup_max_tokens_8000, vary_step: lookup_sales_data, axis: max_tokens_8000, description: Lookup max_tokens=8000 with analysis/visualization generous, steps: {lookup_sales_data: {max_tokens: 8000}, analyzing_data: {max_tokens: 10000}, create_visualization: {max_tokens: 10000}}}

  - {name: analysis_max_tokens_4000, vary_step: analyzing_data, axis: max_tokens_4000, description: Analysis max_tokens=4000 with lookup/visualization generous, steps: {lookup_sales_data: {max_tokens: 8000}, analyzing_data: {max_tokens: 4000}, create_visualization: {max_tokens: 10000}}}
  - {name: analysis_max_tokens_5000, vary_step: analyzing_data, axis: max_tokens_5000, description: Analysis max_tokens=5000 with lookup/visualization generous, steps: {lookup_sales_data: {max_tokens: 8000}, analyzing_data: {max_tokens: 5000}, create_visualization: {max_tokens: 10000}}}
  - {name: analysis_max_tokens_7000_baseline, vary_step: analyzing_data, axis: baseline, description: Analysis baseline max_tokens=7000 with lookup/visualization generous, steps: {lookup_sales_data: {max_tokens: 8000}, analyzing_data: {max_tokens: 7000}, create_visualization: {max_tokens: 10000}}}
  - {name: analysis_max_tokens_10000, vary_step: analyzing_data, axis: max_tokens_10000, description: Analysis max_tokens=10000 with lookup/visualization generous, steps: {lookup_sales_data: {max_tokens: 8000}, analyzing_data: {max_tokens: 10000}, create_visualization: {max_tokens: 10000}}}

  - {name: visualization_max_tokens_4000, vary_step: create_visualization, axis: max_tokens_4000, description: Visualization max_tokens=4000 with lookup/analysis generous, steps: {lookup_sales_data: {max_tokens: 8000}, analyzing_data: {max_tokens: 10000}, create_visualization: {max_tokens: 4000}}}
  - {name: visualization_max_tokens_5000, vary_step: create_visualization, axis: max_tokens_5000, description: Visualization max_tokens=5000 with lookup/analysis generous, steps: {lookup_sales_data: {max_tokens: 8000}, analyzing_data: {max_tokens: 10000}, create_visualization: {max_tokens: 5000}}}
  - {name: visualization_max_tokens_7000_baseline, vary_step: create_visualization, axis: baseline, description: Visualization baseline max_tokens=7000 with lookup/analysis generous, steps: {lookup_sales_data: {max_tokens: 8000}, analyzing_data: {max_tokens: 10000}, create_visualization: {max_tokens: 7000}}}
  - {name: visualization_max_tokens_10000, vary_step: create_visualization, axis: max_tokens_10000, description: Visualization max_tokens=10000 with lookup/analysis generous, steps: {lookup_sales_data: {max_tokens: 8000}, analyzing_data: {max_tokens: 10000}, create_visualization: {max_tokens: 10000}}}
