# Thesis Test 01 baseline manifest for Gemma 4 models.
#
# Use this manifest with:
#   --model gemma4:e4b
#   --model gemma4:26b
#
# The only config is the full-agent baseline. No agent step is varied.

defaults:
  lookup_sales_data:
    n: 1
    cot_n: 1
    bon_param: "temperature"
    temp_min: 1.0
    temp_max: 1.0
    top_p_min: 0.95
    top_p_max: 0.95
    top_k_min: 64
    top_k_max: 64
    max_tokens: 5000
    num_beams: 1
    no_repeat_ngram_size: null
    use_cache: false

  analyzing_data:
    n: 1
    cot_n: 1
    bon_param: "temperature"
    temp_min: 1.0
    temp_max: 1.0
    top_p_min: 0.95
    top_p_max: 0.95
    top_k_min: 64
    top_k_max: 64
    max_tokens: 7000
    num_beams: 1
    no_repeat_ngram_size: null
    use_cache: false

  create_visualization:
    n: 1
    cot_n: 1
    bon_param: "temperature"
    temp_min: 1.0
    temp_max: 1.0
    top_p_min: 0.95
    top_p_max: 0.95
    top_k_min: 64
    top_k_max: 64
    max_tokens: 7000
    num_beams: 1
    no_repeat_ngram_size: null
    use_cache: false

configs:
  - name: baseline
    vary_step: all_steps
    axis: baseline
    description: Full-agent baseline with all steps fixed at Gemma 4 defaults.
    steps: {}

