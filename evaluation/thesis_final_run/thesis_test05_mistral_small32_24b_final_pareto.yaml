# Thesis Test 05 incremental Pareto confirmation for mistral-small3.2:24b.
#
# Use with:
#   --model mistral-small3.2:24b
#
# This manifest contains only new full-agent configurations to run.
# Reuse already measured baseline, static, token-cap, and lookup-CoT
# candidates from Tests 01-04 in the final Pareto merge instead of
# rerunning them here.
#
# Existing evidence to merge:
#   Test 01: baseline
#   Test 02: analysis_top_k_56, lookup_repeat_penalty_1p3,
#            visualization_repeat_last_n_56
#   Test 03: lookup_max_tokens_3000, analysis_max_tokens_5000,
#            visualization_max_tokens_5000
#   Test 04: lookup_cot_n2, lookup_cot_n3, lookup_cot_n4

defaults:
  lookup_sales_data:
    n: 1
    cot_n: 1
    bon_param: "temperature"
    temp_min: 0.15
    temp_max: 0.15
    top_p_min: 0.95
    top_p_max: 0.95
    top_k_min: 64
    top_k_max: 64
    max_tokens: 5000
    num_beams: 1
    no_repeat_ngram_size: null
    use_cache: false

  analyzing_data:
    n: 1
    cot_n: 1
    bon_param: "temperature"
    temp_min: 0.15
    temp_max: 0.15
    top_p_min: 0.95
    top_p_max: 0.95
    top_k_min: 64
    top_k_max: 64
    max_tokens: 7000
    num_beams: 1
    no_repeat_ngram_size: null
    use_cache: false

  create_visualization:
    n: 1
    cot_n: 1
    bon_param: "temperature"
    temp_min: 0.15
    temp_max: 0.15
    top_p_min: 0.95
    top_p_max: 0.95
    top_k_min: 64
    top_k_max: 64
    max_tokens: 7000
    num_beams: 1
    no_repeat_ngram_size: null
    use_cache: false

configs:
  - name: max_tokens_efficient
    vary_step: all_steps
    axis: combined_tokens
    description: "Combine Test 03 efficient caps: lookup=3000, analysis=5000, visualization=5000."
    steps:
      lookup_sales_data: {max_tokens: 3000}
      analyzing_data: {max_tokens: 5000}
      create_visualization: {max_tokens: 5000}

  - name: max_tokens_quality
    vary_step: all_steps
    axis: combined_tokens
    description: "Quality-preserving token candidate: analysis=5000 and visualization=5000 with lookup at baseline."
    steps:
      analyzing_data: {max_tokens: 5000}
      create_visualization: {max_tokens: 5000}

  - name: lookup_cot_n2_efficient_tokens
    vary_step: all_steps
    axis: combined_cot_tokens
    description: "Lower-cost lookup CoT candidate with efficient token caps."
    steps:
      lookup_sales_data: {cot_n: 2, max_tokens: 3000}
      analyzing_data: {max_tokens: 5000}
      create_visualization: {max_tokens: 5000}

  - name: lookup_cot_n3_efficient_tokens
    vary_step: all_steps
    axis: combined_cot_tokens
    description: "Best Test 04 lookup CoT depth with efficient token caps."
    steps:
      lookup_sales_data: {cot_n: 3, max_tokens: 3000}
      analyzing_data: {max_tokens: 5000}
      create_visualization: {max_tokens: 5000}

  - name: combined_static_best
    vary_step: all_steps
    axis: combined_static
    description: "Combine the small positive static signals from Test 02."
    steps:
      lookup_sales_data: {repeat_penalty: 1.3, repeat_last_n: 64}
      analyzing_data: {top_k_min: 56, top_k_max: 56}
      create_visualization: {repeat_penalty: 1.1, repeat_last_n: 56}

  - name: combined_static_best_efficient_tokens
    vary_step: all_steps
    axis: combined_static_tokens
    description: "Static best candidate plus efficient token caps."
    steps:
      lookup_sales_data: {repeat_penalty: 1.3, repeat_last_n: 64, max_tokens: 3000}
      analyzing_data: {top_k_min: 56, top_k_max: 56, max_tokens: 5000}
      create_visualization: {repeat_penalty: 1.1, repeat_last_n: 56, max_tokens: 5000}

  - name: combined_cot_static
    vary_step: all_steps
    axis: combined_cot_static
    description: "Best lookup CoT depth plus the small positive static signals."
    steps:
      lookup_sales_data: {cot_n: 3, repeat_penalty: 1.3, repeat_last_n: 64}
      analyzing_data: {top_k_min: 56, top_k_max: 56}
      create_visualization: {repeat_penalty: 1.1, repeat_last_n: 56}

  - name: combined_cot_static_tokens
    vary_step: all_steps
    axis: combined_cot_accuracy
    description: "Final Mistral candidate: lookup CoT n=3, efficient token caps, and best static analysis/visualization settings."
    steps:
      lookup_sales_data: {cot_n: 3, repeat_penalty: 1.3, repeat_last_n: 64, max_tokens: 3000}
      analyzing_data: {top_k_min: 56, top_k_max: 56, max_tokens: 5000}
      create_visualization: {repeat_penalty: 1.1, repeat_last_n: 56, max_tokens: 5000}
