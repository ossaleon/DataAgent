# Thesis Test 05 incremental Pareto confirmation for gemma4:e4b.
#
# Use with:
#   --model gemma4:e4b
#
# This manifest contains only new full-agent configurations to run.
# Reuse already measured candidates from Tests 01, 03, 04, and 04b in the
# final Pareto merge instead of rerunning them here.
#
# Existing evidence to merge:
#   Test 01: baseline
#   Test 03: analysis/visualization max_tokens single-agent ladders
#   Test 04: lookup_cot_n2, lookup_cot_n4
#   Test 04b: lookup_temp_0p3, lookup_temp_0p8, lookup_cot_n2

defaults:
  lookup_sales_data:
    n: 1
    cot_n: 1
    bon_param: "temperature"
    temp_min: 1.0
    temp_max: 1.0
    top_p_min: 0.95
    top_p_max: 0.95
    top_k_min: 64
    top_k_max: 64
    max_tokens: 5000
    num_beams: 1
    no_repeat_ngram_size: null
    use_cache: false

  analyzing_data:
    n: 1
    cot_n: 1
    bon_param: "temperature"
    temp_min: 1.0
    temp_max: 1.0
    top_p_min: 0.95
    top_p_max: 0.95
    top_k_min: 64
    top_k_max: 64
    max_tokens: 7000
    num_beams: 1
    no_repeat_ngram_size: null
    use_cache: false

  create_visualization:
    n: 1
    cot_n: 1
    bon_param: "temperature"
    temp_min: 1.0
    temp_max: 1.0
    top_p_min: 0.95
    top_p_max: 0.95
    top_k_min: 64
    top_k_max: 64
    max_tokens: 7000
    num_beams: 1
    no_repeat_ngram_size: null
    use_cache: false

configs:
  - name: max_tokens_low_cost
    vary_step: all_steps
    axis: combined_tokens
    description: "Combine Test 03 low-cost caps: analysis=5000 and visualization=4000."
    steps:
      analyzing_data: {max_tokens: 5000}
      create_visualization: {max_tokens: 4000}

  - name: lookup_temp_0p8_low_cost_tokens
    vary_step: all_steps
    axis: combined_static_tokens
    description: "Best 04b static lookup temperature with low-cost downstream token caps."
    steps:
      lookup_sales_data: {temp_min: 0.8, temp_max: 0.8}
      analyzing_data: {max_tokens: 5000}
      create_visualization: {max_tokens: 4000}

  - name: lookup_cot_n2_temp_0p8
    vary_step: all_steps
    axis: combined_lookup
    description: "Lookup CoT n=2 plus the best static lookup temperature from 04b."
    steps:
      lookup_sales_data: {cot_n: 2, temp_min: 0.8, temp_max: 0.8}

  - name: lookup_cot_n4_temp_0p8
    vary_step: all_steps
    axis: combined_lookup
    description: "High-accuracy lookup repair: CoT n=4 plus static lookup temperature 0.8."
    steps:
      lookup_sales_data: {cot_n: 4, temp_min: 0.8, temp_max: 0.8}

  - name: lookup_cot_n2_low_cost_tokens
    vary_step: all_steps
    axis: combined_cot_tokens
    description: "Cost-aware lookup CoT n=2 with low-cost downstream token caps."
    steps:
      lookup_sales_data: {cot_n: 2}
      analyzing_data: {max_tokens: 5000}
      create_visualization: {max_tokens: 4000}

  - name: lookup_cot_n4_low_cost_tokens
    vary_step: all_steps
    axis: combined_cot_tokens
    description: "Higher-depth lookup CoT n=4 with low-cost downstream token caps."
    steps:
      lookup_sales_data: {cot_n: 4}
      analyzing_data: {max_tokens: 5000}
      create_visualization: {max_tokens: 4000}

  - name: lookup_cot_n2_temp_0p8_low_cost_tokens
    vary_step: all_steps
    axis: combined_accuracy_cost
    description: "Best cost-aware E4B candidate: lookup CoT n=2, temperature 0.8, and low-cost downstream caps."
    steps:
      lookup_sales_data: {cot_n: 2, temp_min: 0.8, temp_max: 0.8}
      analyzing_data: {max_tokens: 5000}
      create_visualization: {max_tokens: 4000}

  - name: lookup_cot_n4_temp_0p8_low_cost_tokens
    vary_step: all_steps
    axis: combined_accuracy
    description: "Highest-accuracy E4B candidate: lookup CoT n=4, temperature 0.8, and low-cost downstream caps."
    steps:
      lookup_sales_data: {cot_n: 4, temp_min: 0.8, temp_max: 0.8}
      analyzing_data: {max_tokens: 5000}
      create_visualization: {max_tokens: 4000}
