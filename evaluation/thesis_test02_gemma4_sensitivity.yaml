# Thesis Test 02: agent-step parameter sensitivity for Gemma 4 models.
#
# Use with:
#   --model gemma4:e4b
#   --model gemma4:26b

defaults:
  lookup_sales_data:
    n: 1
    cot_n: 1
    bon_param: "temperature"
    temp_min: 1.0
    temp_max: 1.0
    top_p_min: 0.95
    top_p_max: 0.95
    top_k_min: 64
    top_k_max: 64
    max_tokens: 5000
    num_beams: 1
    no_repeat_ngram_size: null
    use_cache: false
  analyzing_data:
    n: 1
    cot_n: 1
    bon_param: "temperature"
    temp_min: 1.0
    temp_max: 1.0
    top_p_min: 0.95
    top_p_max: 0.95
    top_k_min: 64
    top_k_max: 64
    max_tokens: 7000
    num_beams: 1
    no_repeat_ngram_size: null
    use_cache: false
  create_visualization:
    n: 1
    cot_n: 1
    bon_param: "temperature"
    temp_min: 1.0
    temp_max: 1.0
    top_p_min: 0.95
    top_p_max: 0.95
    top_k_min: 64
    top_k_max: 64
    max_tokens: 7000
    num_beams: 1
    no_repeat_ngram_size: null
    use_cache: false

configs:
  - {name: lookup_baseline, vary_step: lookup_sales_data, axis: baseline, description: Lookup baseline, steps: {}}
  - {name: lookup_temperature_low, vary_step: lookup_sales_data, axis: temperature_low, description: Lower lookup temperature, steps: {lookup_sales_data: {temp_min: 0.6, temp_max: 0.6}}}
  - {name: lookup_temperature_high, vary_step: lookup_sales_data, axis: temperature_high, description: Higher lookup temperature, steps: {lookup_sales_data: {temp_min: 1.3, temp_max: 1.3}}}
  - {name: lookup_top_p_low, vary_step: lookup_sales_data, axis: top_p_low, description: Lower lookup nucleus sampling, steps: {lookup_sales_data: {top_p_min: 0.80, top_p_max: 0.80}}}
  - {name: lookup_top_k_low, vary_step: lookup_sales_data, axis: top_k_low, description: Lower lookup top-k, steps: {lookup_sales_data: {top_k_min: 20, top_k_max: 20}}}
  - {name: lookup_top_k_high, vary_step: lookup_sales_data, axis: top_k_high, description: Higher lookup top-k, steps: {lookup_sales_data: {top_k_min: 128, top_k_max: 128}}}
  - {name: lookup_bon_temperature_n2, vary_step: lookup_sales_data, axis: best_of_n, description: Best-of-2 lookup varying temperature low-to-baseline, steps: {lookup_sales_data: {n: 2, bon_param: temperature, temp_min: 0.6, temp_max: 1.0}}}
  - {name: lookup_bon_temperature_n3, vary_step: lookup_sales_data, axis: best_of_n, description: Best-of-3 lookup varying temperature low-to-high, steps: {lookup_sales_data: {n: 3, bon_param: temperature, temp_min: 0.6, temp_max: 1.3}}}
  - {name: lookup_cot_n2, vary_step: lookup_sales_data, axis: cot_n2, description: Two-pass lookup refinement, steps: {lookup_sales_data: {cot_n: 2}}}

  - {name: analysis_baseline, vary_step: analyzing_data, axis: baseline, description: Analysis baseline, steps: {}}
  - {name: analysis_temperature_low, vary_step: analyzing_data, axis: temperature_low, description: Lower analysis temperature, steps: {analyzing_data: {temp_min: 0.6, temp_max: 0.6}}}
  - {name: analysis_temperature_high, vary_step: analyzing_data, axis: temperature_high, description: Higher analysis temperature, steps: {analyzing_data: {temp_min: 1.3, temp_max: 1.3}}}
  - {name: analysis_top_p_low, vary_step: analyzing_data, axis: top_p_low, description: Lower analysis nucleus sampling, steps: {analyzing_data: {top_p_min: 0.80, top_p_max: 0.80}}}
  - {name: analysis_top_k_low, vary_step: analyzing_data, axis: top_k_low, description: Lower analysis top-k, steps: {analyzing_data: {top_k_min: 20, top_k_max: 20}}}
  - {name: analysis_top_k_high, vary_step: analyzing_data, axis: top_k_high, description: Higher analysis top-k, steps: {analyzing_data: {top_k_min: 128, top_k_max: 128}}}
  - {name: analysis_bon_temperature_n2, vary_step: analyzing_data, axis: best_of_n, description: Best-of-2 analysis varying temperature low-to-baseline, steps: {analyzing_data: {n: 2, bon_param: temperature, temp_min: 0.6, temp_max: 1.0}}}
  - {name: analysis_cot_n2, vary_step: analyzing_data, axis: cot_n2, description: Two-pass analysis refinement, steps: {analyzing_data: {cot_n: 2}}}

  - {name: visualization_baseline, vary_step: create_visualization, axis: baseline, description: Visualization baseline, steps: {}}
  - {name: visualization_temperature_low, vary_step: create_visualization, axis: temperature_low, description: Lower visualization temperature, steps: {create_visualization: {temp_min: 0.6, temp_max: 0.6}}}
  - {name: visualization_temperature_high, vary_step: create_visualization, axis: temperature_high, description: Higher visualization temperature, steps: {create_visualization: {temp_min: 1.3, temp_max: 1.3}}}
  - {name: visualization_top_p_low, vary_step: create_visualization, axis: top_p_low, description: Lower visualization nucleus sampling, steps: {create_visualization: {top_p_min: 0.80, top_p_max: 0.80}}}
  - {name: visualization_top_k_low, vary_step: create_visualization, axis: top_k_low, description: Lower visualization top-k, steps: {create_visualization: {top_k_min: 20, top_k_max: 20}}}
  - {name: visualization_top_k_high, vary_step: create_visualization, axis: top_k_high, description: Higher visualization top-k, steps: {create_visualization: {top_k_min: 128, top_k_max: 128}}}
  - {name: visualization_bon_top_k_n2, vary_step: create_visualization, axis: best_of_n, description: Best-of-2 visualization varying top-k, steps: {create_visualization: {n: 2, bon_param: top_k, top_k_min: 20, top_k_max: 128}}}
  - {name: visualization_cot_n2, vary_step: create_visualization, axis: cot_n2, description: Two-pass visualization refinement, steps: {create_visualization: {cot_n: 2}}}
